# ── Conectividade aos portos (e_connport) ──────────────────────────────────────
# Custo mínimo de transporte pela malha viária até os portos, com os dados do pacote GPM do
# TerraME (a mesma rede e os mesmos 14 portos do caso de paridade `connectivity` do
# disscube-benchmark): o custo de cada trecho vem da coluna `custo_ajus`; trechos fora da via custam
# o dobro (`outside = 2.0`) e a célula entra na rede pelo vértice mais próximo (`entrance = "vertex"`).
# - unidade em metros (`unit_scale` omitido = 1): os betas de e_connport no modelo de verificação são
#   ~1e-8, a escala das demais distâncias;
# - `targets` é o .shp dos portos, lido do cache (fonte `ports`, sources.toml).
[[derive]]
target = "e_connport"
source = "roads"
operator = "network_cost"
params = { targets = "terrame_fill/br_ports_5880.shp", cost_column = "custo_ajus", outside = 2.0, entrance = "vertex", crs = "EPSG:5880" }

# ── Déficit Hídrico Máximo Cumulativo (MCWD) ──────────────────────────────────
# Descomente quando o arquivo 'mcwd/MCWD_ampli_2000.tif' estiver em data/raw/
# [[derive]]
# target = "mcwda"
# source = "mcwd_2000"
# operator = "mean"
# fill = "nearest"

# ── Máscara do Espaço Celular (Fração do Território Brasileiro) ──────────────
[[derive]]
target = "mask"
source = "brazil_boundary"
operator = "area"
role = "mask"