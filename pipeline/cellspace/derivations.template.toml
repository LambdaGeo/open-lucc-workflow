# disslucc-br-data — Espaço Celular na Grade Oficial do Brazil Data Cube (BDC V2)
# Projeção: Cônica de Albers de Área Equivalente (SIRGAS 2000 Albers)
# Resolução: 10.560 m (10,56 km) — subdivisão exata 10x10 de cada tile BDC_SM (105.600 m)
#
#     disscube run pipeline/2_cellspace/cellspace_bdc.toml --workspace data/cube
#

schema = 1
name = "disslucc-br — BDC 10.56 km Albers Equal-Area Grid"
sources_from_catalog = true

[grid]
name = "bdc_10k"
crs = "+proj=aea +lat_0=-12 +lon_0=-54 +lat_1=-2 +lat_2=-22 +x_0=5000000 +y_0=10000000 +ellps=GRS80 +units=m +no_defs"
resolution = 10560.0
# Bbox alinhado aos limites de tiles BDC_SM cobrindo todo o Brasil:
bbox = [2465600.0, 7360000.0, 7956800.0, 12112000.0]

[[derive]]
target = "forest_vegetation"
source = "lc_forest_vegetation"
operator = "mean"
role = "land_use"

[[derive]]
target = "country_vegetation"
source = "lc_country_vegetation"
operator = "mean"
role = "land_use"

[[derive]]
target = "pasture_management"
source = "lc_pasture_management"
operator = "mean"
role = "land_use"

[[derive]]
target = "agricultural"
source = "lc_agricultural"
operator = "mean"
role = "land_use"

[[derive]]
target = "mosaic_of_occupations"
source = "lc_mosaic_of_occupations"
operator = "mean"
role = "land_use"

[[derive]]
target = "forestry"
source = "lc_forestry"
operator = "mean"
role = "land_use"

[[derive]]
target = "others"
source = "lc_others"
operator = "mean"
role = "land_use"

