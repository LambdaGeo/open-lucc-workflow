# Input layers of the workflow: the 16 files that feed the verification model's input raster.
#
# Only what the derivations use is declared (derivations.template.toml). Layers of the earlier
# catalogue that no derivation reads (airports, waterways, industries, states and municipalities,
# the agricultural-aptitude map, ...) were removed.
#
# Where the files come from:
#   - LuccME-BR land cover, 2000 (seven classes): Zenodo record 5123560 (Bezerra et al. 2021,
#     DOI 10.5281/zenodo.5123560, CC-BY-4.0), the original file, version v1.0.0 (a later version, v2,
#     10.5281/zenodo.10611737, exists and is not used);
#   - state roads (SNV), railways and municipal seats: ANA metadata catalogue (DNIT and IBGE data), original address;
#   - conservation units (CNUC 2024-02, protection-integral group created up to 2016): MMA open data portal, CC BY;
#   - indigenous lands (FUNAI, `Regularizada`): WFS of FUNAI (live, monthly); unmodified copy in the provisional data release (data-preview);
#   - rural settlements: INCRA, Acervo Fundiário (layer "Assentamento Brasil"); licence to be confirmed with INCRA;
#   - IBGE: original address, not copied (see docs/DATA.md);
#   - TerraME GPM data (road network and ports): github.com/TerraME/gpm at commit
#     3aa0e91498f37d1b55adbe54d5d0fda3137f251f (last commit, 6 Dec 2019). The files are the same as before
#     (same SHA-256); only the address changed, from the pinned copy in terrame-docker to the origin.
#
#     disscube fetch pipeline/grid/sources.toml
#     disscube run pipeline/grid/sources.toml --workspace data/cube_<grid>
#
schema = 1
name = "Brazil: input layers of the verification model"

# ── Land cover, 2000: seven classes from one netCDF (LuccME-BR database, about 100 km2 pixels)
