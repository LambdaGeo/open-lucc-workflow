# ── Protected areas and settlements
[[source]]
id = "cnuc_pi"
type = "file"
path = "zip://mma/shp_cnuc_2024_02.zip!cnuc_2024_02.shp"
read = { columns = ["grupo", "cria_ano"], where = "grupo NOT LIKE 'Uso%' AND (cria_ano LIKE '%-19__' OR cria_ano LIKE '%-200_' OR cria_ano LIKE '%-2010' OR cria_ano LIKE '%-2011' OR cria_ano LIKE '%-2012' OR cria_ano LIKE '%-2013' OR cria_ano LIKE '%-2014' OR cria_ano LIKE '%-2015' OR cria_ano LIKE '%-2016')" }
# origin (MMA, CC BY): https://dados.mma.gov.br/dataset/44b6dc8a-dc82-4a84-8d95-1b0da7c85dac/resource/9ec98f66-44ad-4397-8583-a1d9cc3a9835/download/shp_cnuc_2024_02.zip
url = "https://github.com/LambdaGeo/open-lucc-workflow/releases/download/data-preview/shp_cnuc_2024_02.zip"
sha256 = "f9ebd906f7a2c1fa29ecc7203386631fcaa0f4c05be75335c5d6011f0a6ad534"

# FUNAI publishes the layer through a live WFS (monthly updates, and a server certificate chain that Python does not
# verify), so the file is served from a provisional copy (unmodified, accessed 2026-10) with a pinned SHA-256.
# origin: https://geoserver.funai.gov.br/geoserver/Funai/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=Funai%3Atis_poligonais&maxFeatures=10000&outputFormat=SHAPE-ZIP
[[source]]
id = "funai_ti"
type = "file"
path = "zip://funai/tis_poligonais.zip"
read = { where = "fase_ti = 'Regularizada'" }
url = "https://github.com/LambdaGeo/open-lucc-workflow/releases/download/data-preview/tis_poligonais.zip"
sha256 = "fc7ffed5b82cb1eb2e240575f24d7a407402901f5a1ecfd73c78ae876c759db5"

[[source]]
id = "protected_areas"
type = "union"
of = ["cnuc_pi", "funai_ti"]

[[source]]
